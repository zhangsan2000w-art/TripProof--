services:
  app:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env.local
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      DATABASE_PATH: /app/.data/tripproof.db
      APP_URL: https://${DOMAIN:-localhost}
    volumes:
      - tripproof-data:/app/.data
    expose:
      - '3000'
    stop_grace_period: 30s
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  tripproof-data:
  caddy-data:
  caddy-config:
